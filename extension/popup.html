<!DOCTYPE html>
<html>
<head>
    <title>SmartShield AI</title>
    <style>
        body {
            width: 340px;
            padding: 20px;
            background: #000000;
            color: white;
            font-family: Segoe UI, sans-serif;
        }
        h2 {
            margin: 0;
            background: linear-gradient(90deg, #a855f7, #ec4899);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-align: center;
            font-size: 22px;
        }
        .subtitle {
            text-align: center;
            color: #c084fc;
            font-size: 12px;
            margin-bottom: 20px;
        }
        button {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 10px;
            background: linear-gradient(90deg, #7c3aed, #db2777);
            color: white;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            transition: opacity 0.2s;
        }
        button:hover {
            opacity: 0.85;
        }
        .card {
            margin-top: 20px;
            padding: 15px;
            border-radius: 12px;
            background: #111111;
            border: 1px solid #2d1b4e;
        }
        .placeholder {
            text-align: center;
            color: #a855f7;
            padding: 20px 0;
        }
        .status {
            font-size: 20px;
            font-weight: bold;
            text-align: center;
            margin-bottom: 15px;
        }
        .confidence {
            font-size: 30px;
            font-weight: bold;
            text-align: center;
            color: #e879f9;
        }
        .label {
            color: #c084fc;
            margin-top: 12px;
            margin-bottom: 5px;
        }
        .risk-level {
            text-align: center;
            font-weight: bold;
            font-size: 18px;
        }
        .progress-container {
            width: 100%;
            height: 18px;
            background: #1a0a2e;
            border-radius: 10px;
            overflow: hidden;
            margin-top: 8px;
        }
        .progress-bar {
            height: 100%;
            width: 0%;
            transition: width 0.5s;
            background: linear-gradient(90deg, #7c3aed, #ec4899);
        }
        .recommendation {
            margin-top: 15px;
            padding: 10px;
            background: #0d0d1a;
            border: 1px solid #2d1b4e;
            border-radius: 8px;
            font-size: 13px;
            color: #e2d4f0;
        }
        .accuracy {
            margin-top: 15px;
            text-align: center;
            color: #a855f7;
            font-size: 13px;
        }
    </style>
</head>
<body>
    <h2>SmartShield AI</h2>
    <div class="subtitle">
        Threat Intelligence Engine
    </div>
    <button id="analyzeBtn">
        Analyze Current Page
    </button>
    <div id="result" class="card">
        <div class="placeholder">
            Click "Analyze Current Page"
        </div>
    </div>
    <script src="popup.js"></script>
</body>
</html>
